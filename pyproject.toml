[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicintel"
version = "0.1.0"
description = "Music Intelligence — audio recognition and analysis toolkit"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11",
    "numpy",
    "scipy",
    "soundfile>=0.13",   # libsndfile >=1.2 gives MP3/Opus encode for degradations
    "sounddevice",
    "requests",          # fixture-corpus fetching
    "faiss-cpu",         # baseline MFCC/FAISS recognizer under evaluation
    "numba>=0.58",       # compiles the matcher's offset-cluster loop; see matcher.py
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["musicintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
