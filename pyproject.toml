[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicintel"
version = "0.1.0"
description = "Music Intelligence — audio recognition and analysis toolkit"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11",
    "numpy",
    "scipy",
    "soundfile>=0.13",   # libsndfile >=1.2 gives MP3/Opus encode for degradations
    "sounddevice",
    "requests",          # fixture-corpus fetching
    "faiss-cpu",         # baseline MFCC/FAISS recognizer under evaluation
    "numba>=0.58",       # compiles the matcher's offset-cluster loop; see matcher.py
]

[project.optional-dependencies]
# The HTTP service. Kept out of the core dependency set so the library and the
# evaluation harness install without a web stack.
api = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # multipart uploads for /v1/identify
    "redis>=5.0",               # rate limiting and audio-second quotas
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "soxr",              # resampling in the sandboxed decoder, which never imports librosa
]

# Durable identity, configuration and usage history (Stage 2).
db = [
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",        # fastapi TestClient
    "fakeredis>=2.25",    # limiter tests without a server
    "lupa>=2.0",          # fakeredis needs it to execute the limiter's Lua
    "schemathesis>=3.38", # OpenAPI conformance
    "pgserver>=0.1.4",    # a real PostgreSQL for the persistence tests
]

[tool.setuptools.packages.find]
include = ["musicintel*"]

# The migrations are resolved relative to the installed package
# (musicintel/db/migrate.py), so they must travel in the wheel. Without this the
# runner finds an empty directory and reports applying nothing -- silently.
[tool.setuptools.package-data]
"musicintel.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
